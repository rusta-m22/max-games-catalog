meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "22"
build:
  skip: true
  additionalCommands: null
  artifacts:
    "*": /
run:
  scriptName: serve.mjs
  scriptArguments: null
  nodeArguments: null
  command: node --input-type=module -e "import {server} from './serve.mjs';
    server.listen(8080, '0.0.0.0');"
  persistenceMount: /data
  containerPort: "8080"
  singleton: false
  zeroDowntime: true
